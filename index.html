<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yousaf Brothers - Staff App</title>
  <!-- DNS Prefetch & Preconnect for fast loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://firebaseapp.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <link rel="stylesheet" href="index.css">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <h2>Yousaf Brothers</h2>
          <p>Stone Supplier</p>
        </div>
        <button id="sidebar-close" class="sidebar-close-btn"><i class="ri-arrow-left-line"></i></button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" style="margin-top: auto; padding: 20px; font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9;">
        <p style="margin: 0; opacity: 0.8;">System Developed By:</p>
        <p style="margin: 4px 0 0 0; font-weight: 700; color: #475569;">Jahanzeb Baloch</p>
        <p style="margin: 2px 0 0 0; opacity: 0.8;">03060711529</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-toggle" class="icon-btn"><i class="ri-menu-line"></i></button>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <div class="user-profile">
            <div class="avatar">MY</div>
            <span>Muhammad Yousaf</span>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <div id="view-container" class="view-container">
      </div>
    </main>
  </div>

  <script src="js/store.js" type="module"></script>
  <script src="js/utils.js" type="module"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
